plugins {
    id 'base'
}

allprojects {
    apply plugin: 'idea'

    version = '0.1.0-SNAPSHOT'
    group = 'com.makeasaying'

    ext {
        appName = 'Make-A-Saying'
        gdxVersion = '1.13.1'
        controllersVersion = '2.2.3'
        imguiVersion = '1.89.0'
        luajVersion = '3.0.1'
        jacksonVersion = '2.17.2'
        junitVersion = '5.11.0'
    }

    repositories {
        mavenCentral()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url "https://oss.sonatype.org/content/repositories/releases/" }
    }
}

subprojects {
    apply plugin: 'java-library'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    compileJava {
        options.encoding = 'UTF-8'
        options.compilerArgs << "-Xlint:all" << "-Xlint:-processing"
    }

    compileTestJava {
        options.encoding = 'UTF-8'
    }

    test {
        useJUnitPlatform()
        testLogging {
            events "passed", "skipped", "failed"
        }
    }

    dependencies {
        testImplementation "org.junit.jupiter:junit-jupiter-api:${junitVersion}"
        testImplementation "org.junit.jupiter:junit-jupiter-params:${junitVersion}"
        testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
        testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    }
}

// Architectural rule enforcement: :engine must never depend on any editor module
project(':engine') {
    afterEvaluate {
        configurations.all { conf ->
            conf.dependencies.all { dep ->
                if (dep instanceof ProjectDependency && dep.name.startsWith('editor')) {
                    throw new GradleException("Architectural violation: :engine must not depend on ${dep.name}")
                }
            }
        }
    }
}
